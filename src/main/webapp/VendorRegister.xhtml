<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Register Vendor</title>
    <h:outputStylesheet library="css" name="style.css"/>
    <style>
        /* internal CSS */
        .form-container h2 { text-transform: uppercase; letter-spacing: 1px; }
    </style>
</h:head>
<h:body>
    <div class="navbar">
        <h:link outcome="index" value="SoleLink" styleClass="brand"/>
        <h:link outcome="VendorList" value="Vendors"/>
        <h:link outcome="ShoeList" value="Shoes"/>
    </div>

    <div class="form-container">
        <h2>Register a New Vendor</h2>
        <h:messages styleClass="error-messages" layout="table"/>

        <h:form>
            <div class="form-row">
                <label>Shop Name</label>
                <h:inputText value="#{vendorBean.vendor.shopName}" required="true"
                             requiredMessage="Shop name is required.">
                    <f:validateLength minimum="2" maximum="100"/>
                </h:inputText>
            </div>

            <div class="form-row">
                <label>Phone</label>
                <h:inputText value="#{vendorBean.vendor.phone}" required="true"
                             requiredMessage="Phone number is required."
                             validatorMessage="Enter a valid Rwandan phone number (e.g. 0788123456).">
                    <f:validateRegex pattern="^(\+250|0)7[0-9]{8}$"/>
                </h:inputText>
            </div>

            <div class="form-row">
                <label>Email</label>
                <h:inputText value="#{vendorBean.vendor.email}" required="true"
                             requiredMessage="Email is required."/>
            </div>

            <div class="form-row">
                <label>Location</label>
                <h:inputText value="#{vendorBean.vendor.location}" required="true"
                             requiredMessage="Location is required."/>
            </div>

            <h:commandButton value="Register Vendor" action="#{vendorBean.register}"
                             styleClass="btn-primary"
                             style="margin-top:10px;"/>
        </h:form>

        <p style="text-align:center; margin-top:15px;">
            <h:link outcome="VendorList" value="View all vendors"/>
        </p>
    </div>
</h:body>
</html>
