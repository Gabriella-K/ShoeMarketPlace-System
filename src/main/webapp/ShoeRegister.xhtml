<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Add Shoe</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="navbar">
        <h:link outcome="index" value="SoleLink" styleClass="brand"/>
        <h:link outcome="VendorList" value="Vendors"/>
        <h:link outcome="ShoeList" value="Shoes"/>
    </div>

    <div class="form-container">
        <h2>Add a New Shoe Listing</h2>
        <h:messages styleClass="error-messages" layout="table"/>

        <h:form>
            <div class="form-row">
                <label>Vendor</label>
                <h:selectOneMenu value="#{shoeBean.selectedVendorId}" required="true"
                                 requiredMessage="Please select a vendor.">
                    <f:selectItem itemLabel="-- Select Vendor --" itemValue=""/>
                    <f:selectItems value="#{shoeBean.allVendors}" var="v"
                                   itemLabel="#{v.shopName}" itemValue="#{v.id}"/>
                </h:selectOneMenu>
            </div>

            <div class="form-row">
                <label>Brand</label>
                <h:inputText id="brand" value="#{shoeBean.shoe.brand}" required="true"
                             requiredMessage="Brand is required.">
                    <f:validateLength minimum="2" maximum="50"/>
                </h:inputText>
                <h:message for="brand" style="color:#b47c74; display:block;"/>
            </div>

            <div class="form-row">
                <label>Size</label>
                <h:inputText value="#{shoeBean.shoe.size}" required="true"
                             requiredMessage="Size is required."
                             validatorMessage="Size must be between 30 and 50.">
                    <f:validateLongRange minimum="30" maximum="50"/>
                </h:inputText>
            </div>

            <div class="form-row">
                <label>Price (RWF)</label>
                <h:inputText value="#{shoeBean.shoe.price}" required="true"
                             requiredMessage="Price is required."/>
            </div>

            <div class="form-row">
                <label>Condition</label>
                <h:selectOneMenu value="#{shoeBean.shoe.condition}" required="true"
                                 requiredMessage="Please select a condition.">
                    <f:selectItems value="#{shoeBean.conditions}" var="c"
                                   itemLabel="#{c}" itemValue="#{c}"/>
                </h:selectOneMenu>
            </div>

            <h:commandButton value="Add Shoe" action="#{shoeBean.register}" styleClass="btn-primary"/>
        </h:form>

        <p style="text-align:center; margin-top:15px;">
            <h:link outcome="ShoeList" value="View all shoes"/>
        </p>
    </div>
</h:body>
</html>
